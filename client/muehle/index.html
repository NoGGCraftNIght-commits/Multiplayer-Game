<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d0b1a">
<title>Mühle Online</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect x='6' y='6' width='52' height='52' fill='none' stroke='%23ffcf5c' stroke-width='5'/><circle cx='32' cy='32' r='11' fill='%23ff4d8d'/></svg>">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap">
<style>
:root { --bg:#0d0b1a; --gold:#ffcf5c; --pink:#ff4d8d; --cyan:#3ee8ff; --txt:#f1eefc; --mute:#9a93c2; --w1:#fffaf0; --w2:#d8cbb0; --b1:#4a4560; --b2:#141020; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--txt); font-family: Outfit, system-ui, sans-serif; overflow-x: hidden; }
body::before { content: ''; position: fixed; inset: -50%; z-index: -1;
  background: radial-gradient(circle at 30% 30%, #3b1d6e 0, transparent 35%), radial-gradient(circle at 70% 60%, #0f4a6b 0, transparent 35%), radial-gradient(circle at 50% 90%, #6b1d4a 0, transparent 30%);
  animation: drift 24s linear infinite; }
@keyframes drift { to { transform: rotate(360deg); } }
button, input { font: inherit; }
.btn { border: 0; border-radius: 14px; padding: 14px 22px; font-weight: 800; font-size: 17px; cursor: pointer; color: #1a1030;
  background: linear-gradient(135deg, var(--gold), #ff9a3c); box-shadow: 0 6px 24px #ff9a3c55; transition: transform .15s, box-shadow .15s; }
.btn:hover { transform: translateY(-2px) scale(1.03); box-shadow: 0 10px 32px #ff9a3c88; }
.btn:active { transform: scale(.97); }
.btn.alt { background: linear-gradient(135deg, var(--cyan), #7a6bff); box-shadow: 0 6px 24px #3ee8ff44; }
.btn.ghost { background: #ffffff14; color: var(--txt); box-shadow: none; }
.screen { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; padding: 24px 16px; }
.hidden { display: none !important; }
h1 { margin: 0; font-size: clamp(48px, 13vw, 96px); font-weight: 800; letter-spacing: -2px;
  background: linear-gradient(90deg, var(--gold), var(--pink), var(--cyan), var(--gold)); background-size: 300%; -webkit-background-clip: text; background-clip: text; color: transparent;
  animation: shine 6s linear infinite; filter: drop-shadow(0 4px 30px #ff4d8d55); }
@keyframes shine { to { background-position: 300%; } }
.sub { color: var(--mute); margin-top: -10px; }
.card { background: #ffffff0d; border: 1px solid #ffffff1f; border-radius: 20px; padding: 20px; width: min(380px, 100%); display: flex; flex-direction: column; gap: 12px; backdrop-filter: blur(8px); }
.row { display: flex; gap: 10px; }
.row > * { flex: 1; min-width: 0; }
input.code { background: #00000044; border: 2px solid #ffffff22; border-radius: 14px; padding: 12px; color: var(--txt); text-transform: uppercase; letter-spacing: 6px; text-align: center; font-weight: 800; font-size: 20px; outline: none; }
input.code:focus { border-color: var(--cyan); }
.err { color: #ff7a9a; min-height: 1.2em; text-align: center; }
.bigcode { font-size: 54px; font-weight: 800; letter-spacing: 10px; color: var(--gold); text-shadow: 0 0 30px #ffcf5c88; animation: pulse 1.6s ease-in-out infinite; }
@keyframes pulse { 50% { transform: scale(1.06); } }
.dots::after { content: ''; animation: dots 1.4s steps(4) infinite; }
@keyframes dots { 0% { content: ''; } 25% { content: '.'; } 50% { content: '..'; } 75% { content: '...'; } }

/* Spiel */
#game { min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 10px 16px 16px; gap: 8px; }
.top { width: min(560px, 100%); display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.tag { font-size: 13px; color: var(--mute); background: #ffffff10; border-radius: 999px; padding: 6px 12px; white-space: nowrap; }
#status { font-size: clamp(17px, 4.5vw, 22px); font-weight: 600; text-align: center; min-height: 1.4em; transition: color .3s; }
#status.me { color: var(--gold); text-shadow: 0 0 18px #ffcf5c66; }
#stage { position: relative; width: min(560px, 100%, calc((100vh - 130px) / 1.3)); aspect-ratio: 100 / 130; user-select: none; touch-action: manipulation; }
#stage.shake { animation: shake .45s; }
@keyframes shake { 20% { transform: translate(-6px, 3px) rotate(-.6deg); } 40% { transform: translate(5px, -4px) rotate(.5deg); } 60% { transform: translate(-4px, 2px); } 80% { transform: translate(3px, -1px); } }
#lines { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; }
.wood { fill: url(#boardg); stroke: #ffffff22; stroke-width: .4; filter: drop-shadow(0 6px 20px #0008); }
.ln { stroke: var(--gold); stroke-width: .9; fill: none; stroke-linecap: round; filter: drop-shadow(0 0 1.5px #ffcf5c); stroke-dasharray: 400; stroke-dashoffset: 400; animation: draw 1.6s ease-out forwards; }
@keyframes draw { to { stroke-dashoffset: 0; } }
.millline { stroke: #fff; stroke-width: 2.4; stroke-linecap: round; filter: drop-shadow(0 0 3px var(--pink)) drop-shadow(0 0 6px var(--pink)); stroke-dasharray: 100; stroke-dashoffset: 100; animation: draw .5s ease-out forwards, glow 1s ease-in-out .5s infinite alternate; }
@keyframes glow { to { stroke: var(--pink); } }
.pt { position: absolute; width: 9%; aspect-ratio: 1; transform: translate(-50%, -50%); border-radius: 50%; cursor: pointer; display: grid; place-items: center; }
.pt::after { content: ''; width: 26%; aspect-ratio: 1; border-radius: 50%; background: var(--gold); box-shadow: 0 0 8px var(--gold); transition: transform .2s; }
.pt:hover::after { transform: scale(1.5); }
.pt.target::after { width: 46%; background: transparent; border: 3px solid var(--cyan); box-shadow: 0 0 12px var(--cyan), inset 0 0 8px var(--cyan); animation: ring 1s ease-in-out infinite; }
@keyframes ring { 50% { transform: scale(1.25); opacity: .6; } }
.pc { position: absolute; width: 8.6%; aspect-ratio: 1; transform: translate(-50%, -50%); z-index: 2; pointer-events: none;
  transition: left .6s cubic-bezier(.45,-0.25,.3,1.35), top .6s cubic-bezier(.45,-0.25,.3,1.35); }
.pc.hand { transition-duration: .35s; }
.pc i { display: block; width: 100%; height: 100%; border-radius: 50%; transition: transform .25s, box-shadow .25s; }
.pc.w i { background: radial-gradient(circle at 35% 30%, #fff 0, var(--w1) 30%, var(--w2) 100%); box-shadow: inset 0 -3px 6px #0003, 0 4px 10px #0007, 0 0 0 2px #fff6 inset; }
.pc.b i { background: radial-gradient(circle at 35% 30%, #8a81b0 0, var(--b1) 30%, var(--b2) 100%); box-shadow: inset 0 -3px 6px #0006, 0 4px 10px #0009, 0 0 0 2px #ffffff22 inset; }
.pc i::after { content: ''; position: absolute; inset: 22%; border-radius: 50%; border: 2px solid #0000001a; }
.pc.b i::after { border-color: #ffffff14; }
.pc.fly { z-index: 5; }
.pc.fly i { animation: lift .6s ease-in-out; }
@keyframes lift { 50% { transform: scale(1.45) rotate(25deg); box-shadow: 0 22px 30px #000a; } }
.pc.land i { animation: land .35s ease-out; }
@keyframes land { 0% { transform: scale(1.1, .85); } 50% { transform: scale(.94, 1.06); } }
.pc.can i { animation: bob 1.2s ease-in-out infinite; }
@keyframes bob { 50% { transform: translateY(-8%) scale(1.06); box-shadow: 0 0 16px var(--gold), 0 10px 14px #0008; } }
.pc.sel { z-index: 4; } .pc.sel i { transform: scale(1.25); box-shadow: 0 0 0 3px var(--cyan), 0 0 26px var(--cyan) !important; animation: none; }
.pc.kill i { animation: wobble .5s ease-in-out infinite; box-shadow: 0 0 0 3px var(--pink), 0 0 24px var(--pink) !important; }
@keyframes wobble { 25% { transform: rotate(-12deg) scale(1.08); } 75% { transform: rotate(12deg) scale(1.08); } }
.pc.inmill i { animation: millpop .7s ease-out; }
@keyframes millpop { 40% { transform: scale(1.4); box-shadow: 0 0 30px var(--pink), 0 0 60px var(--pink); } }
.pc.dead i { animation: die .55s ease-in forwards; }
@keyframes die { 30% { transform: scale(1.4) rotate(40deg); filter: brightness(2.5); } 100% { transform: scale(0) rotate(220deg); opacity: 0; } }
.pc.gone { display: none; }
.spark { position: absolute; width: 1.6%; aspect-ratio: 1; border-radius: 50%; pointer-events: none; z-index: 6; transform: translate(-50%, -50%); animation: spark .8s ease-out forwards; }
@keyframes spark { to { transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(0); opacity: 0; } }
.ripple { position: absolute; width: 9%; aspect-ratio: 1; border-radius: 50%; border: 2px solid var(--gold); transform: translate(-50%, -50%); pointer-events: none; animation: ripple .6s ease-out forwards; z-index: 1; }
@keyframes ripple { to { width: 24%; opacity: 0; border-width: 0; } }
.trayname { position: absolute; left: 1%; transform: translateY(-50%); font-size: 13px; color: var(--mute); white-space: nowrap; transition: color .3s, text-shadow .3s; }
.trayname.on { color: var(--gold); text-shadow: 0 0 12px #ffcf5c88; }
#banner { position: fixed; inset: 0; display: grid; place-items: center; pointer-events: none; z-index: 20; }
#banner b { font-size: clamp(50px, 16vw, 120px); font-weight: 800; color: #fff; text-shadow: 0 0 30px var(--pink), 0 0 60px var(--pink); animation: bannerin 1.1s cubic-bezier(.2,1.6,.4,1) forwards; }
@keyframes bannerin { 0% { transform: scale(3) rotate(-10deg); opacity: 0; } 30% { transform: scale(1) rotate(-4deg); opacity: 1; } 75% { opacity: 1; } 100% { transform: scale(.9) rotate(-4deg); opacity: 0; } }
#over { position: fixed; inset: 0; z-index: 15; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; background: #0d0b1acc; backdrop-filter: blur(4px); animation: fade .5s; padding: 16px; text-align: center; }
@keyframes fade { from { opacity: 0; } }
#over h2 { font-size: clamp(40px, 11vw, 72px); margin: 0; }
.confetti { position: fixed; top: -20px; width: 10px; height: 16px; z-index: 30; pointer-events: none; animation: fall linear forwards; }
@keyframes fall { to { transform: translate(var(--dx), 110vh) rotate(var(--r)); } }
#toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: #ff4d8d; color: #fff; padding: 10px 18px; border-radius: 12px; font-weight: 600; z-index: 40; animation: fade .3s; max-width: calc(100% - 32px); text-align: center; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; } }
</style>
</head>
<body>
<section id="menu" class="screen">
  <h1>MÜHLE</h1>
  <div class="sub">Online mit Raumcode – oder zu zweit an einem Gerät</div>
  <div class="card">
    <button class="btn" id="create">Raum erstellen</button>
    <div class="row"><input class="code" id="codein" maxlength="5" placeholder="CODE" autocomplete="off" aria-label="Raumcode"><button class="btn alt" id="join">Beitreten</button></div>
    <button class="btn ghost" id="local">Lokal spielen</button>
    <div class="err" id="err"></div>
  </div>
  <a href="../muehle-fps/" style="color:var(--gold);font-weight:600;text-decoration:none">Neu: Mühle FPS – kämpfe um jeden Stein →</a>
</section>

<section id="wait" class="screen hidden">
  <div class="sub" style="margin:0">Dein Raumcode</div>
  <div class="bigcode" id="mycode">·····</div>
  <div class="row" style="width:min(380px,100%)"><button class="btn alt" id="copy">Link kopieren</button><button class="btn ghost" id="cancel">Abbrechen</button></div>
  <div class="sub dots" id="waittxt" style="margin:0">Verbinde</div>
</section>

<section id="game" class="hidden">
  <div class="top"><span class="tag" id="roomtag"></span><button class="btn ghost" id="leave" style="padding:6px 14px;font-size:14px">Verlassen</button></div>
  <div id="status"></div>
  <div id="stage">
    <svg id="lines" viewBox="0 0 100 130" preserveAspectRatio="none">
      <defs><linearGradient id="boardg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2a1d4d"/><stop offset="1" stop-color="#16213f"/></linearGradient></defs>
      <rect class="wood" x="2" y="17" width="96" height="96" rx="4"/>
      <g id="grid"></g><g id="millfx"></g>
    </svg>
    <div class="trayname" id="nameTop" style="top:5.4%"></div>
    <div class="trayname" id="nameBot" style="top:94.6%"></div>
  </div>
</section>

<div id="banner" class="hidden"><b>MÜHLE!</b></div>
<div id="over" class="hidden"><h2 id="overtxt"></h2><div class="row" style="width:min(380px,100%)"><button class="btn" id="again">Revanche</button><button class="btn ghost" id="leave2">Verlassen</button></div><div class="sub" id="overnote" style="margin:0"></div></div>
<script type="module" src="app.js"></script>
</body>
</html>
